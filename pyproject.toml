[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "interp-rocket"
version = "0.7.1"
description = "Interpretable MultiRocket with stable feature selection and leakage-free validation"
readme = "README.md"
license = {text = "BSD-3-Clause"}
requires-python = ">=3.9"
authors = [
    {name = "Mark Laubach", email = "laubach@american.edu"},
]
keywords = [
    "time series",
    "classification",
    "convolutional kernels",
    "ROCKET",
    "interpretability",
    "feature selection",
    "nested cross-validation",
    "feature stability",
    "time-series explainability",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.22",
    "numba>=0.50",
    "scikit-learn>=1.0",
    "matplotlib>=3.5",
    "scipy>=1.8",
    "tqdm>=4.64",
]

[project.optional-dependencies]
datasets = [
    "aeon>=1.0",
    "openml>=0.14",
]
tshap = [
    "tshap==0.0.1",
]
notebooks = [
    "jupyterlab>=4",
]
test = [
    "pytest>=7",
]

[project.urls]
Homepage = "https://github.com/LaubachLab/i-rocket"
Repository = "https://github.com/LaubachLab/i-rocket"
Issues = "https://github.com/LaubachLab/i-rocket/issues"

[tool.setuptools]
py-modules = ["feature_selection", "interp_rocket", "interpretability", "irocket_model_selection", "model_selection", "stability_nogueira", "spectral", "tshap_integration"]
packages = ["_irocket_selection"]
